<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Navigation Test Page</h1>
    
    <div id="test-results"></div>
    
    <h2>Manual Tests</h2>
    <button onclick="testStartExam('mock')">Test Mock Exam</button>
    <button onclick="testStartExam('algorithm')">Test Algorithm</button>
    <button onclick="testStartExam('practice')">Test Practice</button>
    
    <h2>Function Status</h2>
    <div id="function-status"></div>
    
    <script src="questions.js"></script>
    <script src="script.js"></script>
    <script>
        // Override DOM methods to prevent errors during testing
        const originalGetElementById = document.getElementById;
        document.getElementById = function(id) {
            const element = originalGetElementById.call(this, id);
            if (element) return element;
            
            // Return a mock element if not found
            return {
                style: { display: 'none' },
                textContent: '',
                innerHTML: '',
                disabled: false,
                classList: { add: () => {}, remove: () => {} },
                scrollIntoView: () => {}
            };
        };
        
        // Test function availability
        function testFunctionAvailability() {
            const results = document.getElementById('test-results');
            const functions = ['startExam', 'showStats', 'backToMenu', 'showScreen'];
            
            functions.forEach(funcName => {
                const div = document.createElement('div');
                div.className = 'test-result';
                
                if (typeof window[funcName] === 'function') {
                    div.className += ' pass';
                    div.textContent = `✓ ${funcName}() is available`;
                } else {
                    div.className += ' fail';
                    div.textContent = `✗ ${funcName}() is NOT available`;
                }
                results.appendChild(div);
            });
        }
        
        // Test data availability
        function testDataAvailability() {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = 'test-result';
            
            if (typeof questions !== 'undefined' && questions.algorithm) {
                div.className += ' pass';
                div.textContent = `✓ Questions data loaded (${questions.algorithm.length} algorithm questions)`;
            } else {
                div.className += ' fail';
                div.textContent = '✗ Questions data NOT loaded';
            }
            results.appendChild(div);
        }
        
        // Test startExam function
        function testStartExam(examType) {
            try {
                startExam(examType);
                console.log(`✓ startExam('${examType}') executed successfully`);
                alert(`✓ startExam('${examType}') executed successfully`);
            } catch (error) {
                console.error(`✗ startExam('${examType}') failed:`, error);
                alert(`✗ startExam('${examType}') failed: ${error.message}`);
            }
        }
        
        // Run tests when page loads
        window.addEventListener('load', () => {
            console.log('Running navigation tests...');
            testFunctionAvailability();
            testDataAvailability();
            
            // Show function status
            const status = document.getElementById('function-status');
            status.innerHTML = `
                <p>startExam: ${typeof startExam}</p>
                <p>questions: ${typeof questions}</p>
                <p>questions.algorithm length: ${questions && questions.algorithm ? questions.algorithm.length : 'N/A'}</p>
            `;
        });
    </script>
</body>
</html>
